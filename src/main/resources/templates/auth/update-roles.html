<!DOCTYPE html>
<html lang="hu" xmlns:th="http://www.thymeleaf.org">
<body>
<section class="form-card auth-form-card" th:fragment="content">
    <form th:action="@{/auth/update-roles}" method="post">
        <label>
            User
            <select id="role-user-select" name="userId" required>
                <option value="" selected disabled>Select a user</option>
                <option th:each="user : ${users}"
                        th:value="${user.id}"
                        th:attr="data-roles=${#strings.setJoin(user.roles, ',')}"
                        th:text="${user.username + ' (' + user.id + ')'}">
                    username (user-id)
                </option>
            </select>
        </label>
        <fieldset>
            <legend>New roles</legend>
            <div class="role-options">
                <label class="role-option" th:each="role : ${availableRoles}">
                    <input class="role-checkbox" type="checkbox" name="roles" th:value="${role}">
                    <span th:text="${role}">ROLE</span>
                </label>
            </div>
        </fieldset>
        <button class="primary-button" type="submit">Update roles</button>
    </form>
</section>
</body>
</html>
