<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<section th:fragment="content"
         aria-labelledby="deck-price-summary-title">
    <h2 id="deck-price-summary-title">Deck prices</h2>
    <div class="table-container" th:if="${!deckPriceSummaries.empty}">
        <table data-sortable-table>
            <thead>
            <tr>
                <th scope="col" data-sort-type="text"><button class="sort-button" type="button">Deck name</button></th>
                <th scope="col" data-sort-type="number"><button class="sort-button" type="button">Total From</button></th>
                <th scope="col" data-sort-type="number"><button class="sort-button" type="button">Total Trend</button></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="summary : ${deckPriceSummaries}">
                <td th:attr="data-sort-value=${summary.deckName}">
                    <a th:href="@{/tcg/statistic/{deckId}(deckId=${summary.deckId})}"
                       th:text="${summary.deckName}">Deck</a>
                </td>
                <td th:attr="data-sort-value=${summary.sumFromInEuro}"
                    th:text="${#numbers.formatDecimal(summary.sumFromInEuro, 1, 2)} + ' €'">0.00 €</td>
                <td th:attr="data-sort-value=${summary.sumTrendInEuro}"
                    th:text="${#numbers.formatDecimal(summary.sumTrendInEuro, 1, 2)} + ' €'">0.00 €</td>
            </tr>
            </tbody>
        </table>
    </div>
    <p th:if="${deckPriceSummaries.empty}">There are no active decks to display.</p>
</section>
</body>
</html>
