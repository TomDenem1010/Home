<!DOCTYPE html>
<html lang="hu" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="frontend-event-history-scope" th:content="${frontendEventHistoryScope}">
    <title th:text="${pageTitle} + ' | Home'">Home</title>
    <link rel="stylesheet" th:href="@{/css/home.css}" href="/css/home.css">
    <link rel="stylesheet" th:if="${featureStylesheet != null}" th:href="@{${featureStylesheet}}">
    <script defer th:src="@{/js/frontend-events.js}" src="/js/frontend-events.js"></script>
    <script defer th:if="${featureScript != null}" th:src="@{${featureScript}}"></script>
</head>
<body>
<aside class="sidebar">
    <a class="brand" th:href="@{/}">Home</a>
    <nav aria-label="Főmenü">
        <th:block th:replace="~{menu :: menu(${menuItems}, ${activePath})}"/>
    </nav>
    <form class="logout-form" th:action="@{/logout}" method="post">
        <button type="submit">Logout</button>
    </form>
</aside>
<main th:classappend="${contentTemplate == 'tcg/search-card'} ? 'card-search-main'">
    <div class="page-content">
        <h1 th:text="${pageTitle}">Kezdőlap</h1>
        <p th:text="${pageContent}">Üdvözöllek az alkalmazásban!</p>
        <th:block th:if="${contentTemplate != null}">
            <th:block th:replace="~{${contentTemplate} :: content}"/>
        </th:block>
    </div>
</main>
<aside class="event-sidebar" aria-labelledby="event-history-title">
    <section class="event-history">
        <h2 id="event-history-title">Latest events</h2>
        <ol id="event-history-list" class="event-history__list" aria-live="polite"></ol>
        <p id="event-history-empty" class="event-history__empty">No events yet.</p>
    </section>
</aside>
</body>
</html>
