<!DOCTYPE html>
<html lang="hu" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle} + ' | Home'">Home</title>
    <link rel="stylesheet" th:href="@{/css/home.css}" href="/css/home.css">
</head>
<body>
<aside class="sidebar">
    <a class="brand" th:href="@{/}">Home</a>
    <nav aria-label="Főmenü">
        <ul>
            <li th:each="menuItem : ${menuItems}">
                <a th:href="@{${menuItem.path}}"
                   th:text="${menuItem.label}"
                   th:classappend="${menuItem.path == activePath} ? 'active'"
                   th:attr="aria-current=${menuItem.path == activePath} ? 'page' : null">
                    Menüpont
                </a>
            </li>
        </ul>
    </nav>
</aside>
<main>
    <h1 th:text="${pageTitle}">Kezdőlap</h1>
    <p th:text="${pageContent}">Üdvözöllek az alkalmazásban!</p>
</main>
</body>
</html>
