<!DOCTYPE html>
<html lang="hu" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle} + ' | Home'">Home</title>
    <link rel="stylesheet" th:href="@{/css/home.css}" href="/css/home.css">
    <script defer th:src="@{/js/sortable-tables.js}" src="/js/sortable-tables.js"></script>
</head>
<body>
<aside class="sidebar">
    <a class="brand" th:href="@{/}">Home</a>
    <nav aria-label="Főmenü">
        <th:block th:replace="~{tcg/menu :: menu(${menuItems}, ${activePath})}"/>
    </nav>
</aside>
<main>
    <h1 th:text="${pageTitle}">Kezdőlap</h1>
    <p th:text="${pageContent}">Üdvözöllek az alkalmazásban!</p>
    <th:block th:if="${deckPriceSummaries != null}">
        <th:block th:replace="~{tcg/statistics :: deckPriceStatistics(${deckPriceSummaries})}"/>
    </th:block>
    <th:block th:if="${deckPriceHistorySummary != null}">
        <th:block th:replace="~{tcg/statistics :: deckPriceHistory(${deckPriceHistorySummary})}"/>
    </th:block>
</main>
</body>
</html>
