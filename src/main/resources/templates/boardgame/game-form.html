<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<section class="boardgame-page" th:fragment="content">
    <link rel="stylesheet" th:href="@{/css/boardgame.css}">
    <p class="message error" role="alert" th:if="${error}" th:text="${error}"></p>
    <form th:action="${gameId == null} ? @{/boardgame/games} : @{/boardgame/games/{id}(id=${gameId})}"
          method="post" class="form-card">
        <label>Name <input type="text" name="name" th:value="${form.name}" required maxlength="255"></label>
        <label>BoardGameGeek URL (optional)
            <input type="url" name="bggLink" th:value="${form.bggLink}" maxlength="1000" placeholder="https://boardgamegeek.com/boardgame/123/game-name">
        </label>
        <label>State <select name="state" required>
            <option value="">Select state</option>
            <option th:each="state : ${states}" th:value="${state}" th:selected="${form.state == state}" th:text="${state.label}"></option>
        </select></label>
        <label>Type <select name="type" required>
            <option value="">Select type</option>
            <option th:each="type : ${types}" th:value="${type}" th:selected="${form.type == type}" th:text="${type.label}"></option>
        </select></label>
        <div class="actions"><button type="submit">Save game</button><a th:href="@{/boardgame/games}">Cancel</a></div>
    </form>
</section>
</body>
</html>
