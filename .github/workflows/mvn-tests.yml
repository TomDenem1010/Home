name: Mvn Tests

on:
    pull_request:
        branches:
            -   main
    push:
        branches:
            -   main
    workflow_dispatch:
        inputs:
            branch:
                description: 'Branch to test'
                required: true
                default: 'main'

permissions:
    contents: read

jobs:
    mvn-tests:
        runs-on: ubuntu-latest

        steps:
            -   name: Checkout repository
                uses: actions/checkout@v5
                with:
                    ref: ${{ inputs.branch || 'main' }}

            -   name: Set up JDK 25
                uses: ./.github/actions/setup-jdk-25

            -   name: Run tests
                run: mvn -B test
