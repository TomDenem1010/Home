name: Base Tests

on:
    push:
        branches:
            - main
    workflow_dispatch:
        inputs:
            branch:
                description: 'Branch to test'
                required: true
                default: 'main'

permissions:
    contents: read

jobs:
    spotless-check:
        runs-on: ubuntu-latest

        steps:
            -   name: Checkout repository
                uses: actions/checkout@v5
                with:
                    ref: ${{ inputs.branch || 'main' }}

            -   name: Set up JDK 25
                uses: ./.github/actions/setup-jdk-25

            -   name: Check Java formatting
                run: mvn -B spotless:check

    dependency-check:
        runs-on: ubuntu-latest

        steps:
            -   name: Checkout repository
                uses: actions/checkout@v5
                with:
                    ref: ${{ inputs.branch || 'main' }}

            -   name: Set up JDK 25
                uses: ./.github/actions/setup-jdk-25

            -   name: Run OWASP dependency check
                run: mvn -B dependency-check:check

            -   name: Print OWASP dependency-check summary
                if: always()
                shell: pwsh
                run: |
                    $reportPath = 'target/dependency-check-report.json'

                    if (-not (Test-Path -LiteralPath $reportPath)) {
                        throw "OWASP dependency-check JSON report was not generated."
                    }

                    $report = Get-Content -LiteralPath $reportPath -Raw | ConvertFrom-Json
                    $vulnerabilities = @(
                        $report.dependencies |
                            Where-Object vulnerabilities |
                            ForEach-Object {
                                $dependency = $_.fileName
                                $_.vulnerabilities | ForEach-Object {
                                    [PSCustomObject]@{
                                        Dependency = $dependency
                                        Name = $_.name
                                        Severity = $_.severity
                                        CVSS = if ($_.cvssv3.baseScore) { $_.cvssv3.baseScore } elseif ($_.cvssv2.score) { $_.cvssv2.score } else { 'N/A' }
                                    }
                                }
                            }
                    )

                    $vulnerableDependencies = @($vulnerabilities.Dependency | Sort-Object -Unique).Count
                    Write-Host "Vulnerable dependencies: $vulnerableDependencies"
                    Write-Host "Total vulnerabilities: $($vulnerabilities.Count)"
                    $vulnerabilities |
                        Sort-Object -Property @{ Expression = 'CVSS'; Descending = $true }, Dependency, Name |
                        Format-Table -AutoSize |
                        Out-String |
                        Write-Host

                    @"
                    ## OWASP dependency-check report

                    | Metric | Value |
                    | --- | ---: |
                    | Vulnerable dependencies | $vulnerableDependencies |
                    | Total vulnerabilities | $($vulnerabilities.Count) |

                    "@ | Add-Content $env:GITHUB_STEP_SUMMARY

                    if ($vulnerabilities.Count) {
                        '| Dependency | Vulnerability | Severity | CVSS |' | Add-Content $env:GITHUB_STEP_SUMMARY
                        '| --- | --- | --- | ---: |' | Add-Content $env:GITHUB_STEP_SUMMARY
                        $vulnerabilities |
                            Sort-Object -Property @{ Expression = 'CVSS'; Descending = $true }, Dependency, Name |
                            ForEach-Object {
                                "| $($_.Dependency) | $($_.Name) | $($_.Severity) | $($_.CVSS) |" |
                                    Add-Content $env:GITHUB_STEP_SUMMARY
                            }
                    }

    mutation-check:
        runs-on: ubuntu-latest

        steps:
            -   name: Checkout repository
                uses: actions/checkout@v5
                with:
                    ref: ${{ inputs.branch || 'main' }}

            -   name: Set up JDK 25
                uses: ./.github/actions/setup-jdk-25

            -   name: Run mutation tests
                run: mvn -B test-compile org.pitest:pitest-maven:mutationCoverage

            -   name: Print mutation-test summary
                shell: pwsh
                run: |
                    $csv = Get-ChildItem -Path target/pit-reports -Recurse -Filter mutations.csv |
                        Sort-Object LastWriteTime |
                        Select-Object -Last 1

                    if (-not $csv) {
                        throw "PIT CSV report was not generated."
                    }

                    # PIT's CSV output intentionally has no header row.
                    $headers = 'sourceFile', 'mutatedClass', 'mutator', 'mutatedMethod', 'lineNumber', 'status', 'killingTest'
                    $mutations = Get-Content $csv.FullName | ConvertFrom-Csv -Header $headers
                    $total = $mutations.Count
                    $counts = $mutations | Group-Object -Property status
                    $killed = ($counts | Where-Object Name -eq 'KILLED').Count
                    $survived = ($counts | Where-Object Name -eq 'SURVIVED').Count
                    $notKilled = $total - $killed
                    $mutationScore = if ($total) { [math]::Round((100 * $killed / $total), 2) } else { 0 }
                    $testStrengthDenominator = $killed + $survived
                    $testStrength = if ($testStrengthDenominator) { [math]::Round((100 * $killed / $testStrengthDenominator), 2) } else { 0 }
                    $report = Get-Content (Join-Path $csv.DirectoryName 'index.html') -Raw
                    $lineCoverage = [regex]::Match($report, '(?s)<h3>Project Summary</h3>.*?<td>\d+</td>\s*<td>\s*(?<percentage>\d+)%.*?coverage_legend">(?<covered>\d+)/(?<total>\d+)')

                    if (-not $lineCoverage.Success) {
                        throw "Could not read line coverage from the PIT HTML report."
                    }

                    $lineCoverageValue = "$($lineCoverage.Groups['percentage'].Value)% ($($lineCoverage.Groups['covered'].Value)/$($lineCoverage.Groups['total'].Value))"

                    Write-Host "PIT mutation score: $mutationScore%"
                    Write-Host "PIT test strength: $testStrength%"
                    Write-Host "Line coverage: $lineCoverageValue"
                    Write-Host "Total mutations: $total"
                    Write-Host "Not KILLED: $notKilled"
                    $counts | Sort-Object Name | ForEach-Object {
                        Write-Host "$($_.Name): $($_.Count)"
                    }

                    @"
                    ## PIT mutation-test report

                    | Metric | Value |
                    | --- | ---: |
                    | Mutation score | $mutationScore% |
                    | Test strength | $testStrength% |
                    | Line coverage | $lineCoverageValue |
                    | Total mutations | $total |
                    | KILLED | $killed |
                    | Not KILLED | $notKilled |

                    "@ | Add-Content $env:GITHUB_STEP_SUMMARY
