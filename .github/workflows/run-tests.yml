name: Run Tests

on:
    pull_request:
        branches:
            -   main
    workflow_dispatch:
        inputs:
            branch:
                description: 'Branch to test'
                required: true
                default: 'main'
        

jobs:
    run-tests:
        runs-on: ubuntu-latest

        steps:
            -   name: Checkout repository
                uses: actions/checkout@v4
                with:
                    ref: ${{ inputs.branch || 'main' }}

            -   name: Set up JDK 25
                uses: actions/setup-java@v4
                with:
                    distribution: temurin
                    java-version: "25"
                    cache: maven

            -   name: Run tests
                run: mvn -B test
